[package]
name = "jart"
version = "0.1.0"
license = "MIT"
edition = "2021"
description = "jart — Just Another Research Tool: a local, terminal-first research aggregator"

# Binaries are auto-detected: src/main.rs -> `jart`, src/bin/research.rs -> `research`
# (both thin wrappers over jart::cli::run).

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tower-http = { version = "0.6", features = ["fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
async-trait = "0.1"
toml = "0.8"
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
futures = "0.3"

[dev-dependencies]
wiremock = "0.6"
